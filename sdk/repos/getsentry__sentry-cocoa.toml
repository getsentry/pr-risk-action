# getsentry/sentry-cocoa ebbc5f1d5119bd1badccf58b6c7b2320aa8cbe49

[[area]]
paths = ["Sources/**", "3rd-party-integrations/**", "distribution/**"]
families = ["mobile-native"]

[[kind]]
paths = ["sdk_api*.json"]
kind = "public-api-record"

[[kind]]
paths = ["Sources/SentryCrash/**", "Sources/Sentry/KSCrash/**"]
kind = "dependencies"

[[kind]]
paths = [
  "Package*.swift", "**/Package.swift", "**/*.podspec", "Sentry.xcodeproj/**", "Sentry.xcworkspace/**",
  "Makefile", "fastlane/**", "scripts/**", "Utils/**", ".craft.yml", "Gemfile*", "Brewfile*",
  ".ruby-version", ".swiftpm/**", "Sources/Configuration/**", "Sources/Resources/**",
  "distribution/**", "schema/**",
]
kind = "build-release"

[[kind]]
paths = [
  "Tests/**", "SentryTestUtils*/**", "test-server/**", "Sources/SentryDistributionTests/**",
  "3rd-party-integrations/*/Tests/**", "Plans/**", "SentryTests-Info.plist",
]
kind = "tests"

[[kind]]
paths = ["TestApps/**"]
kind = "samples"

[[kind]]
paths = ["develop-docs/**", "docs/**", "**/*.docc/**", "sentry-spec-compliance.json"]
kind = "docs"

[[kind]]
paths = [
  "linters/**", "skills/**", ".codex/**", ".xcodebuildmcp/**", ".mcp.json", ".clang-format",
  "**/.swiftlint.yml", "dprint.json", ".markdownlint-cli2.jsonc", "**/.spi.yml",
  ".git-blame-ignore-revs", "agents.toml", "warden.toml",
]
kind = "dev-tooling"
