# getsentry/sentry-python e9c62e532e9a7fcd5702583908ff600bdc02480e

[[area]]
paths = ["sentry_sdk/**", "scripts/init_serverless_sdk.py"]
families = ["server"]

[[area]]
paths = ["sentry_sdk/*", "sentry_sdk/ai/**", "sentry_sdk/crons/**", "sentry_sdk/profiler/**"]
families = ["server"]
shared_core = true

[[kind]]
paths = ["tests/**", "tox.ini"]
kind = "tests"

[[kind]]
paths = ["scripts/**", "pyproject.toml", "setup.py", "MANIFEST.in", "renovate.json"]
kind = "build-release"

[[kind]]
paths = ["checkouts/**"]
kind = "dependencies"

[[kind]]
paths = ["docs/**"]
kind = "docs"

[[kind]]
paths = [
  ".coveragerc*", "codecov.yml", "_typos.toml", ".python-version", ".git-blame-ignore-revs",
  "agents.toml", "warden.toml",
]
kind = "dev-tooling"
