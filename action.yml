name: PR Risk Action
description: Classify a public pull request with Jev from metadata and its complete diff.

inputs:
  repo:
    description: Public GitHub repository as owner/name.
    required: true
  pr-number:
    description: Pull request number.
    required: true
  expected-head-sha:
    description: Optional head commit from the triggering event; changed PRs remain unclassified.
    required: false
    default: ""
  result-path:
    description: JSON result path, relative to the workspace unless absolute.
    required: false
    default: risk-pr-result.json

outputs:
  risk-label:
    description: Jev candidate risk label, or empty when classification is unavailable.
    value: ${{ steps.score.outputs.risk_label }}
  status:
    description: Classification status, including explicit unclassified failures.
    value: ${{ steps.score.outputs.status }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      env:
        AI_GATEWAY_API_KEY: ""
      with:
        python-version: "3.11"

    - name: Set up Node
      uses: actions/setup-node@v6
      env:
        AI_GATEWAY_API_KEY: ""
      with:
        node-version: "22.23.1"

    - name: Install trusted Jev worker
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        AI_GATEWAY_API_KEY: ""
      run: npm ci --ignore-scripts --prefix "$GITHUB_ACTION_PATH/worker"

    - name: Score PR risk
      id: score
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
        INPUT_RESULT_PATH: ${{ inputs.result-path }}
      run: PYTHONPATH="$GITHUB_ACTION_PATH/src" python -m risk_pr_agent.action_runner
